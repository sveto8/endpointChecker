services:
  app:
    build: .
    restart: unless-stopped
    environment:
      BIND_ADDRESS: 0.0.0.0
      BLOCK_PRIVATE: "true"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    volumes:
      - ec_data:/data
    networks: [web]
    # NEMA "ports:" - aplikacija nije dostupna izvana, samo Caddyju

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      # OMV sucelje obicno zauzima 80/443, zato Caddy ide na 8080/8443.
      # Na routeru: vanjski 80 -> NAS:8080 i vanjski 443 -> NAS:8443
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  web: {}

volumes:
  ec_data:
  caddy_data:
  caddy_config:
