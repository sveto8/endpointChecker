<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endpoint Checker</title>
<style>
  :root { color-scheme:dark; --bg:#14161a; --panel:#1b1e24; --border:#2c313a; --text:#d8dce3; --muted:#8a919e;
    --accent:#4c8dff; --ok:#3ecf8e; --warn:#f5a524; --err:#f4585b;
    --key:#7cc4ff; --str:#a5e075; --num:#f5a97f; --bool:#c792ea; }
  @media (prefers-color-scheme: light) { :root { color-scheme:light; --bg:#f3f4f6; --panel:#fff; --border:#d9dce2; --text:#1f2430;
    --muted:#6b7280; --key:#0b69c7; --str:#2a7a1f; --num:#b45309; --bool:#8a3ffc; } }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; display:flex; flex-direction:column; }
  header { padding:10px 16px; border-bottom:1px solid var(--border); background:var(--panel); font-weight:600; }
  main { flex:1; display:flex; min-height:0; }
  section { display:flex; flex-direction:column; min-width:260px; min-height:0; background:var(--panel); }
  #left { width:42%; overflow:auto; } #right { flex:1; }
  #divider { width:6px; cursor:col-resize; background:var(--border); } #divider:hover { background:var(--accent); }
  .pad { padding:14px; } .row { display:flex; gap:8px; } .hidden { display:none !important; }
  input[type=text], select, textarea { padding:9px 11px; border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--text); font-size:14px; }
  input[type=text] { flex:1; min-width:0; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); border-color:transparent; }
  select { font-weight:700; }
  button { padding:9px 18px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--border); padding:5px 10px; font-weight:500; font-size:12px; }
  button.ghost:hover { color:var(--text); } button.ghost.active { color:var(--text); border-color:var(--accent); }
  h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .sec { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .sec h3 { margin:0; } .list { max-height:220px; overflow:auto; } .empty { color:var(--muted); font-size:12px; }
  .grp { display:flex; align-items:center; gap:6px; margin-top:8px; font:12px ui-monospace,Consolas,monospace; color:var(--muted); }
  .grp span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ep { display:flex; align-items:center; gap:8px; padding:4px 8px; border-radius:4px; cursor:pointer; font:12px ui-monospace,Consolas,monospace; }
  .ep:hover { background:var(--bg); } .ep b { color:var(--accent); min-width:46px; }
  .ep span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .x { font-style:normal; color:var(--muted); cursor:pointer; padding:0 4px; } .x:hover { color:var(--err); }
  .grip { height:12px; cursor:row-resize; display:flex; align-items:center; justify-content:center; touch-action:none; }
  .grip::before { content:''; width:40px; height:3px; border-radius:2px; background:var(--border); }
  .grip:hover::before { background:var(--accent); }
  .tabs { display:flex; gap:2px; padding:0 14px; border-bottom:1px solid var(--border); }
  .ltab { background:none; color:var(--muted); border-radius:0; padding:8px 12px; border-bottom:2px solid transparent; }
  .ltab.active { color:var(--text); border-bottom-color:var(--accent); } .cnt { color:var(--accent); font-size:12px; }
  .kv { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .kv input[type=text] { padding:6px 8px; font-size:13px; font-family:ui-monospace,Consolas,monospace; }
  .kv label { width:90px; font:13px ui-monospace,Consolas,monospace; color:var(--key); }
  .quick { margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  textarea { width:100%; height:200px; resize:vertical; font:13px/1.5 ui-monospace,Consolas,monospace; margin-top:8px; }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
  .hist { padding:6px 8px; border-radius:4px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font:12px ui-monospace,Consolas,monospace; }
  .hist:hover { background:var(--bg); } .hist b { color:var(--accent); margin-right:6px; }
  .bar { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .badge { padding:2px 9px; border-radius:10px; font-weight:700; font-size:12px; background:var(--bg); }
  .badge.ok { color:var(--ok); } .badge.warn { color:var(--warn); } .badge.err { color:var(--err); }
  .meta { color:var(--muted); font-size:12px; } .spacer { flex:1; } .note { color:var(--warn); font-size:12px; }
  #final { max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #output { flex:1; margin:0; padding:14px; overflow:auto; white-space:pre-wrap; word-break:break-word; font:13px/1.55 ui-monospace,Consolas,monospace; }
  #imgBox { flex:1; overflow:auto; padding:14px; } #img, #vid { max-width:100%; border-radius:6px; display:block; } #aud { width:100%; display:block; }
  .k{color:var(--key)} .s{color:var(--str)} .n{color:var(--num)} .b{color:var(--bool)}
  .lnk { cursor:pointer; } .lnk:hover { text-decoration:underline; }
</style>
</head>
<body>
<header style="display:flex;align-items:center"><span>Endpoint Checker - small webased postman like app by Sveto</span><span class="spacer"></span><button class="ghost hidden" id="quit" title="Stop the Endpoint Checker program">⏻ Quit</button></header>
<main>
  <section id="left">
    <div class="pad">
      <div class="row">
        <select id="method" title="HTTP method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option>
          <option>DELETE</option><option>HEAD</option><option>OPTIONS</option></select>
        <input id="url" type="text" placeholder="Type or paste a URL, e.g. https://random-d.uk/api/random" autofocus>
        <button id="go">Send</button>
        <button class="ghost" id="save" title="Save this request (method + URL) under its host in Saved endpoints">★ Save</button>
      </div>
    </div>

    <div class="tabs">
      <button class="ltab active" data-tab="params">Params <span class="cnt" id="cParams"></span></button>
      <button class="ltab" data-tab="path">Path <span class="cnt" id="cPath"></span></button>
      <button class="ltab" data-tab="headers">Headers <span class="cnt" id="cHeaders"></span></button>
      <button class="ltab" data-tab="body">Body <span class="cnt" id="cBody"></span></button>
    </div>

    <div id="p-params" class="pad"></div>
    <div id="p-path" class="pad hidden"></div>
    <div id="p-headers" class="pad hidden"></div>
    <div id="p-body" class="pad hidden">
      <div class="row" style="align-items:center">
        <select id="bodyType"><option value="json">JSON</option><option value="text">Text</option><option value="form">Form (a=1&amp;b=2)</option></select>
        <button class="ghost" id="fmtJson">Format JSON</button>
      </div>
      <textarea id="body" spellcheck="false" placeholder='{"name": "Ann"}'></textarea>
      <div class="hint">Body is not sent for GET and HEAD. Content-Type is set automatically unless you add it in Headers.</div>
    </div>

    <div class="pad" style="padding-bottom:0">
      <div class="sec"><h3>Saved endpoints</h3></div>
      <div id="saved" class="list"></div>
      <div class="grip" data-for="saved" title="Drag to resize · double-click to reset"></div>
    </div>
    <div class="pad">
      <div class="sec"><h3>History</h3><button class="ghost" id="histClear">Clear</button></div>
      <div id="history" class="list"></div>
      <div class="grip" data-for="history" title="Drag to resize · double-click to reset"></div>
      <div class="hint" id="dataInfo" style="word-break:break-all"></div>
    </div>
  </section>

  <div id="divider"></div>

  <section id="right">
    <div class="bar">
      <span id="status" class="badge">—</span>
      <span id="statusText" class="meta"></span>
      <span id="time" class="meta"></span>
      <span id="size" class="meta"></span>
      <span id="final" class="meta"></span>
      <span class="spacer"></span>
      <span id="note" class="note"></span>
      <button class="ghost active" id="tabBody">Body</button>
      <button class="ghost" id="tabHeaders">Headers</button>
      <button class="ghost active" id="fmtPretty">Pretty</button>
      <button class="ghost" id="fmtRaw">Raw</button>
      <button class="ghost" id="copy">Copy</button>
    </div>
    <pre id="output">Enter a URL and press Send (or Enter).</pre>
    <div id="imgBox" class="hidden"><img id="img" alt="response image"><video id="vid" controls></video><audio id="aud" controls></audio></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const data = { params:[{on:true,k:'',v:''}], headers:[{on:true,k:'',v:''}], path:[] };
let state = { body:'', headers:'', tab:'body', pretty:true, json:null, image:null, finalUrl:'' };
const enc = s => encodeURIComponent(s);
const dec = s => { try { return decodeURIComponent(s.replace(/\+/g,' ')); } catch { return s; } };

// ---- saved endpoints, grouped automatically by host ----
const SEED_URLS = ['/random','/quack','/randomimg','/list','/:num.jpg','/:num.gif','/http/:code'].map(p => 'https://random-d.uk/api' + p);
let apis = [];   // [{ origin:'https://host', eps:[{ m:'GET', p:'/path?query' }] }]
const splitUrl = u => { const m = /^(https?:\/\/[^\/?#]+)(.*)$/i.exec(u); return m ? { origin:m[1].toLowerCase(), p:m[2] || '/' } : null; };
function addSaved(url, m) {
  const s = splitUrl(url); if (!s) return false;
  let g = apis.find(x => x.origin === s.origin);
  if (!g) { g = { origin:s.origin, eps:[] }; apis.push(g); }
  if (!g.eps.some(e => e.m === m && e.p === s.p)) g.eps.push({ m, p:s.p });
  return true;
}

// ---- persistence: the Java server keeps everything in endpoint-checker-data.json next to the jar ----
let hist = [];            // request history, newest first
let serverStore = false;  // true when the server can keep the data file
let dataPath = '', saveTimer = null;
const saveApis = () => persist();

function setDataInfo(text, bad) { const el = $('dataInfo'); el.textContent = text; el.title = dataPath; el.style.color = bad ? 'var(--err)' : ''; }
function backupToBrowser() {
  try { localStorage.setItem('ec_saved', JSON.stringify(apis)); localStorage.setItem('ec_hist2', JSON.stringify(hist)); } catch {}
}
function persist() {
  if (!serverStore) { backupToBrowser(); return; }
  clearTimeout(saveTimer); saveTimer = setTimeout(persistNow, 300);
}
async function persistNow() {
  try {
    const r = await fetch('/api/data', { method:'POST', headers:{ 'X-EC-Data':'1', 'Content-Type':'application/json' },
                                         body: JSON.stringify({ version:1, saved:apis, history:hist }) });
    if (!r.ok) throw new Error(await r.text());
    setDataInfo('Data file: ' + dataPath);
  } catch (e) { backupToBrowser(); setDataInfo('⚠ Could not write the data file (' + e.message + '). Data is kept in this browser for now.', true); }
}
// Browser storage: used for migration into the data file, or as a fallback without the server
function loadFromBrowser() {
  apis = null;
  try { const raw = localStorage.getItem('ec_saved'); if (raw) apis = JSON.parse(raw); } catch {}
  if (!Array.isArray(apis)) {
    apis = [];
    let old = null; try { old = JSON.parse(localStorage.getItem('ec_apis')); } catch {}   // oldest "base + paths" format
    if (Array.isArray(old)) old.forEach(a => (a.eps || []).forEach(e => addSaved(String(a.base).replace(/\/+$/, '') + (e.p || ''), e.m || 'GET')));
    else SEED_URLS.forEach(u => addSaved(u, 'GET'));
  }
  try { hist = JSON.parse(localStorage.getItem('ec_hist2') || '[]'); } catch { hist = []; }
  if (!Array.isArray(hist)) hist = [];
}
async function loadData() {
  try {
    const r = await fetch('/api/data');
    if (r.ok) {
      serverStore = true;
      dataPath = decodeURIComponent(r.headers.get('X-Data-File') || '');
      const txt = (await r.text()).trim();
      if (txt) {
        let d;
        try { d = JSON.parse(txt); }
        catch { // never overwrite a file we cannot read
          serverStore = false; loadFromBrowser();
          setDataInfo('⚠ The data file is not valid JSON - fix or delete it: ' + dataPath, true); return;
        }
        apis = Array.isArray(d.saved) ? d.saved : []; hist = Array.isArray(d.history) ? d.history : [];
        setDataInfo('Data file: ' + dataPath); return;
      }
    }
  } catch {}
  loadFromBrowser();                       // no data file yet (first run) or no server storage
  if (serverStore) await persistNow();     // create the file, migrating what the browser had
  else setDataInfo('Saved in this browser only.');
}

function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function drawApis() {
  const box = $('saved'); box.innerHTML = '';
  if (!apis.length) { box.innerHTML = '<div class="empty">Nothing saved yet. Enter a URL above and press ★ Save.</div>'; return; }
  apis.forEach((g, gi) => {
    const head = mk('div', 'grp'); head.title = g.origin;
    const x = mk('i', 'x', '✕'); x.title = 'Delete this host and all its saved endpoints';
    x.onclick = () => { if (confirm('Delete ' + g.origin + ' and its ' + g.eps.length + ' saved endpoint(s)?')) { apis.splice(gi, 1); saveApis(); drawApis(); } };
    head.append(mk('span', '', g.origin.replace(/^https:\/\//, '')), x); box.appendChild(head);
    g.eps.forEach((e, ei) => {
      const r = mk('div', 'ep'); r.title = e.m + ' ' + g.origin + e.p;
      const rx = mk('i', 'x', '✕'); rx.title = 'Remove';
      rx.onclick = ev => { ev.stopPropagation(); g.eps.splice(ei, 1); if (!g.eps.length) apis.splice(gi, 1); saveApis(); drawApis(); };
      r.append(mk('b', '', e.m), mk('span', '', e.p), rx);
      r.onclick = () => useEndpoint(g, e); box.appendChild(r);
    });
  });
}
function useEndpoint(g, e) {
  $('method').value = e.m;
  $('url').value = g.origin + e.p;
  urlToParams(false); syncPath();
  if (data.path.length) showTab('path');
  else if (e.m === 'GET' || e.m === 'HEAD') send();
  else showTab('body');
}
function saveCurrent() {
  if (!addSaved($('url').value.trim(), $('method').value)) { alert('Enter a full URL first (starting with http:// or https://).'); return; }
  saveApis(); drawApis();
  $('save').textContent = '✓ Saved'; setTimeout(() => $('save').textContent = '★ Save', 1200);
}

// ---- key/value tables (Params, Headers) ----
function renderKV(name) {
  const box = $('p-' + name), rows = data[name]; box.innerHTML = '';
  const hint = mk('div', 'hint', name === 'params' ? 'Query parameters – added to the URL as ?key=value.' : 'Sent as HTTP headers with the request.');
  hint.style.margin = '0 0 8px'; box.appendChild(hint);
  rows.forEach((r, i) => {
    const d = document.createElement('div'); d.className = 'kv';
    d.innerHTML = '<input type="checkbox"><input type="text" placeholder="key"><input type="text" placeholder="value"><button class="ghost">✕</button>';
    const [cb, k, v, x] = d.children;
    cb.checked = r.on; k.value = r.k; v.value = r.v;
    cb.onchange = () => { r.on = cb.checked; changed(name); };
    k.oninput = () => { r.k = k.value; changed(name); };
    v.oninput = () => { r.v = v.value; changed(name); };
    x.onclick = () => { rows.splice(i, 1); if (!rows.length) rows.push({on:true,k:'',v:''}); renderKV(name); changed(name); };
    box.appendChild(d);
  });
  const add = document.createElement('button'); add.className = 'ghost'; add.textContent = '+ Add';
  add.onclick = () => { rows.push({on:true,k:'',v:''}); renderKV(name); };
  box.appendChild(add);
  if (name === 'headers') {
    const q = document.createElement('div'); q.className = 'quick';
    [['+ Bearer token','Authorization','Bearer '], ['+ API key','X-API-Key',''], ['+ Accept JSON','Accept','application/json']].forEach(([label,k,v]) => {
      const b = document.createElement('button'); b.className = 'ghost'; b.textContent = label;
      b.onclick = () => { const e = rows.find(r => !r.k && !r.v); if (e) Object.assign(e, {k,v,on:true}); else rows.push({on:true,k,v});
        renderKV('headers'); changed('headers'); };
      q.appendChild(b);
    });
    box.appendChild(q);
  }
}
function changed(name) { if (name === 'params') paramsToUrl(); counts(); }
function counts() {
  const n = a => a.filter(r => r.on && r.k.trim()).length || '';
  $('cParams').textContent = n(data.params); $('cHeaders').textContent = n(data.headers);
  $('cPath').textContent = data.path.length || ''; $('cBody').textContent = $('body').value.trim() ? '•' : '';
}

// ---- URL <-> Params sync ----
function paramsToUrl() {
  const u = $('url').value, i = u.indexOf('?'), base = i < 0 ? u : u.slice(0, i);
  const qs = data.params.filter(p => p.on && p.k).map(p => enc(p.k) + '=' + enc(p.v)).join('&');
  $('url').value = base + (qs ? '?' + qs : '');
}
function urlToParams(keepDisabled = true) {
  const u = $('url').value, i = u.indexOf('?');
  const parsed = i < 0 ? [] : u.slice(i + 1).split('&').filter(Boolean).map(s => {
    const j = s.indexOf('='); return { on:true, k:dec(j < 0 ? s : s.slice(0, j)), v:dec(j < 0 ? '' : s.slice(j + 1)) };
  });
  data.params = [...parsed, ...(keepDisabled ? data.params.filter(p => !p.on) : [])];
  if (!data.params.length) data.params.push({on:true,k:'',v:''});
  renderKV('params'); counts();
}

// ---- path variables (/:name in the URL) ----
const PATHVAR = /\/:([A-Za-z_]\w*)/g;
function syncPath() {
  const u = $('url').value, i = u.indexOf('?'), p = i < 0 ? u : u.slice(0, i);
  const names = [...new Set([...p.matchAll(PATHVAR)].map(m => m[1]))], old = data.path;
  data.path = names.map(n => ({ k:n, v:(old.find(o => o.k === n) || {}).v || '' }));
  renderPath(); counts();
}
function renderPath() {
  const box = $('p-path'); box.innerHTML = '';
  if (!data.path.length) { box.innerHTML = '<div class="hint">No path variables. Put <code>:name</code> in the URL, e.g. <code>/http/:code</code>.</div>'; return; }
  data.path.forEach(r => {
    const d = document.createElement('div'); d.className = 'kv';
    const l = document.createElement('label'); l.textContent = ':' + r.k;
    const v = document.createElement('input'); v.type = 'text'; v.placeholder = 'value'; v.value = r.v;
    v.oninput = () => { r.v = v.value; };
    d.append(l, v); box.appendChild(d);
  });
}
function showTab(t) {
  document.querySelectorAll('.ltab').forEach(x => x.classList.toggle('active', x.dataset.tab === t));
  ['params','path','headers','body'].forEach(n => $('p-' + n).classList.toggle('hidden', n !== t));
}

// ---- request ----
function b64(s) { let bin = ''; new TextEncoder().encode(s).forEach(c => bin += String.fromCharCode(c)); return btoa(bin); }
function showError(msg) {
  setStatus('ERROR', 'err'); $('statusText').textContent = 'The request could not be completed.'; $('time').textContent = ''; $('size').textContent = ''; $('final').textContent = '';
  Object.assign(state, { body:msg, headers:'', json:null, image:null }); render();
}

async function send() {
  const method = $('method').value;
  let url = $('url').value.trim(); if (!url) return;

  const qi = url.indexOf('?'); let path = qi < 0 ? url : url.slice(0, qi); const qs = qi < 0 ? '' : url.slice(qi);
  const missing = [];
  path = path.replace(PATHVAR, (m, n) => {
    const r = data.path.find(x => x.k === n);
    if (!r || !r.v.trim()) { missing.push(n); return m; }
    return '/' + enc(r.v.trim());
  });
  if (missing.length) { showTab('path'); showError('Fill in path variable(s): ' + missing.join(', ')); return; }
  url = path + qs;

  const hdrs = data.headers.filter(h => h.on && h.k.trim());
  const body = $('body').value;
  const hasBody = method !== 'GET' && method !== 'HEAD' && body.trim() !== '';
  if (hasBody && !hdrs.some(h => h.k.trim().toLowerCase() === 'content-type')) {
    hdrs.push({ k:'Content-Type', v:{ json:'application/json', text:'text/plain', form:'application/x-www-form-urlencoded' }[$('bodyType').value] });
  }
  const fwd = hdrs.map(h => h.k.trim() + ': ' + h.v).join('\n');

  $('go').disabled = true; $('output').textContent = 'Sending request...';
  try {
    const res = await fetch('/api/proxy?method=' + method + '&url=' + enc(url), {
      method:'POST', headers: fwd ? { 'X-EC-Headers': b64(fwd) } : {}, body: hasBody ? body : ''
    });
    const buf = await res.arrayBuffer();
    const code = +res.headers.get('X-Upstream-Status');

    if (!code) { showError(new TextDecoder().decode(buf)); }
    else {
      const ds = describeStatus(code);
      setStatus(code + (ds.name ? ' ' + ds.name : ''), code < 300 ? 'ok' : code < 400 ? 'warn' : 'err');
      $('statusText').textContent = ds.text;
      $('time').textContent = res.headers.get('X-Upstream-Time') + ' ms';
      $('size').textContent = fmtSize(+res.headers.get('X-Upstream-Size'));
      const fin = res.headers.get('X-Upstream-Url') || '';
      $('final').textContent = fin && fin !== url ? '→ ' + fin : ''; $('final').title = fin;
      state.finalUrl = fin || url;
      state.headers = decodeB64(res.headers.get('X-Upstream-Headers') || '');

      const ct = (res.headers.get('X-Upstream-Content-Type') || '').toLowerCase();
      if (state.image) URL.revokeObjectURL(state.image);
      state.image = null; state.json = null;
      const kind = ct.startsWith('image/') ? 'img' : ct.startsWith('video/') ? 'vid' : ct.startsWith('audio/') ? 'aud' : '';
      if (kind) {
        state.kind = kind; state.body = '';
        state.image = URL.createObjectURL(new Blob([buf], { type: ct.split(';')[0] }));
      } else if (!ct || /text|json|xml|javascript|html|yaml|csv|x-www-form/.test(ct)) {
        let cs = (/charset=([^;]+)/.exec(ct) || [])[1] || 'utf-8', text;
        try { text = new TextDecoder(cs.trim()).decode(buf); } catch { text = new TextDecoder().decode(buf); }
        state.body = text;
        try { state.json = JSON.parse(text); } catch {}
      } else {
        state.body = '(binary content: ' + ct + ', ' + fmtSize(buf.byteLength) + ')';
      }
      saveHistory({ m:method, u:$('url').value.trim(), h:data.headers, b:body, bt:$('bodyType').value, pv:data.path });
      render();
    }
  } catch (e) { showError(String(e)); }
  $('go').disabled = false;
}

// ---- response view ----
function render() {
  $('note').textContent = '';
  const out = $('output'), box = $('imgBox');
  if (state.tab === 'headers') { box.classList.add('hidden'); out.classList.remove('hidden'); out.textContent = state.headers || '(none)'; return; }
  if (state.image) {
    out.classList.add('hidden'); box.classList.remove('hidden');
    ['img','vid','aud'].forEach(id => {
      const el = $(id);
      if (id === state.kind) { el.classList.remove('hidden'); el.src = state.image; }
      else { el.classList.add('hidden'); if (id !== 'img') el.pause(); el.removeAttribute('src'); if (id !== 'img') el.load(); }
    });
    return;
  }
  box.classList.add('hidden'); out.classList.remove('hidden');
  if (state.pretty && state.json !== null && typeof state.json === 'object') {
    out.innerHTML = highlight(JSON.stringify(state.json, null, 2));
  } else {
    if (state.pretty && state.body && state.json === null) $('note').textContent = 'Not valid JSON – showing RAW';
    out.textContent = state.body || '(empty response)';
  }
}
$('vid').onloadedmetadata = () => { const v = $('vid'); $('note').textContent = v.videoWidth + ' × ' + v.videoHeight + ' px, ' + v.duration.toFixed(1) + ' s'; };
$('aud').onloadedmetadata = () => { $('note').textContent = $('aud').duration.toFixed(1) + ' s'; };
$('img').onload = () => { $('note').textContent = $('img').naturalWidth + ' × ' + $('img').naturalHeight + ' px'; };

function highlight(json) {
  json = json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return json.replace(/("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(\.\d+)?([eE][+-]?\d+)?)/g, m => {
    let c = 'n';
    if (/^"/.test(m)) {
      if (/:$/.test(m)) c = 'k';
      else {
        if (/^"https?:\/\/[^"\s]+"$/.test(m)) return '<span class="s lnk" data-url="' + m.slice(1, -1) + '" title="Click to request this URL">' + m + '</span>';
        c = 's';
      }
    } else if (/true|false|null/.test(m)) c = 'b';
    return '<span class="' + c + '">' + m + '</span>';
  });
}
$('output').addEventListener('click', e => {
  const l = e.target.closest('.lnk'); if (!l) return;
  $('method').value = 'GET'; $('url').value = l.dataset.url; urlToParams(false); syncPath(); send();
});
// ---- HTTP status descriptions ----
const STATUS_CLASS = { 1:'Informational', 2:'Success', 3:'Redirection', 4:'Client error', 5:'Server error' };
const STATUS = {
  100:['Continue','The server received the request headers; the client may send the body.'],
  101:['Switching Protocols','The server is switching to the protocol requested by the client.'],
  102:['Processing','The server is still working on the request.'],
  103:['Early Hints','Preliminary headers sent so the client can start preloading resources.'],
  200:['OK','The request succeeded.'],
  201:['Created','The request succeeded and a new resource was created.'],
  202:['Accepted','The request was accepted but has not been processed yet.'],
  203:['Non-Authoritative Information','The response was modified by a proxy and may differ from the origin.'],
  204:['No Content','The request succeeded and there is nothing to return.'],
  205:['Reset Content','The request succeeded; the client should reset its view or form.'],
  206:['Partial Content','Only part of the resource is returned (range request).'],
  207:['Multi-Status','Several results for several operations are returned (WebDAV).'],
  208:['Already Reported','Members were already listed in an earlier part of the response (WebDAV).'],
  226:['IM Used','The response is the result of one or more instance manipulations.'],
  300:['Multiple Choices','There are several possible responses; the client has to choose one.'],
  301:['Moved Permanently','The resource has a new permanent URL.'],
  302:['Found','The resource is temporarily at a different URL.'],
  303:['See Other','The result is at another URL, to be fetched with GET.'],
  304:['Not Modified','The cached copy is still valid; no body is sent.'],
  307:['Temporary Redirect','Temporary redirect; the same method and body must be reused.'],
  308:['Permanent Redirect','Permanent redirect; the same method and body must be reused.'],
  400:['Bad Request','The server could not understand the request (malformed syntax or invalid data).'],
  401:['Unauthorized','Authentication is required or the credentials are invalid.'],
  402:['Payment Required','Reserved for payment systems; some APIs use it for exceeded plans.'],
  403:['Forbidden','The server understood the request but refuses to allow it.'],
  404:['Not Found','The requested resource does not exist at this URL.'],
  405:['Method Not Allowed','This HTTP method is not supported for this endpoint.'],
  406:['Not Acceptable','The server cannot produce a response matching the Accept headers.'],
  407:['Proxy Authentication Required','Authentication with the proxy is required.'],
  408:['Request Timeout','The server timed out waiting for the request.'],
  409:['Conflict','The request conflicts with the current state of the resource.'],
  410:['Gone','The resource existed but has been permanently removed.'],
  411:['Length Required','The request must include a Content-Length header.'],
  412:['Precondition Failed','A condition in the request headers was not met.'],
  413:['Content Too Large','The request body is larger than the server accepts.'],
  414:['URI Too Long','The URL is longer than the server accepts.'],
  415:['Unsupported Media Type','The Content-Type of the request body is not supported.'],
  416:['Range Not Satisfiable','The requested byte range cannot be served.'],
  417:['Expectation Failed','The Expect header could not be met.'],
  418:["I'm a teapot",'A joke status from RFC 2324; the server refuses to brew coffee.'],
  421:['Misdirected Request','The request was sent to a server that cannot answer it.'],
  422:['Unprocessable Content','The request is well-formed but contains semantic errors (validation failed).'],
  423:['Locked','The resource is locked (WebDAV).'],
  424:['Failed Dependency','The request failed because a previous request failed (WebDAV).'],
  425:['Too Early','The server refuses to process a request that might be replayed.'],
  426:['Upgrade Required','The client must switch to a different protocol.'],
  428:['Precondition Required','The server requires the request to be conditional.'],
  429:['Too Many Requests','Rate limit exceeded; slow down and retry later.'],
  431:['Request Header Fields Too Large','The request headers are too large.'],
  451:['Unavailable For Legal Reasons','The resource is blocked for legal reasons.'],
  500:['Internal Server Error','The server hit an unexpected error while handling the request.'],
  501:['Not Implemented','The server does not support the functionality required for this request.'],
  502:['Bad Gateway','A gateway or proxy received an invalid response from the upstream server.'],
  503:['Service Unavailable','The server is overloaded or down for maintenance; try again later.'],
  504:['Gateway Timeout','A gateway or proxy timed out waiting for the upstream server.'],
  505:['HTTP Version Not Supported','The HTTP version of the request is not supported.'],
  506:['Variant Also Negotiates','Server configuration error in content negotiation.'],
  507:['Insufficient Storage','The server cannot store what is needed to complete the request (WebDAV).'],
  508:['Loop Detected','The server detected an infinite loop while processing (WebDAV).'],
  510:['Not Extended','Further extensions to the request are required.'],
  511:['Network Authentication Required','Network authentication is required (e.g. a captive portal).']
};
function describeStatus(code) {
  const cls = STATUS_CLASS[Math.floor(code / 100)] || 'Unknown', d = STATUS[code];
  return { name: d ? d[0] : '', text: Math.floor(code / 100) + 'xx ' + cls + (d ? ' – ' + d[1] : '') };
}
function setStatus(t, cls) { const s = $('status'); s.textContent = t; s.className = 'badge ' + cls; }
function fmtSize(b) { return b < 1024 ? b + ' B' : (b/1024).toFixed(1) + ' KB'; }
function decodeB64(s) { try { return new TextDecoder().decode(Uint8Array.from(atob(s), c => c.charCodeAt(0))); } catch { return ''; } }

// ---- history (kept in the data file; includes headers, so tokens too) ----
function saveHistory(e) {
  hist = [e, ...hist.filter(x => !(x.m === e.m && x.u === e.u))].slice(0, 30);
  persist(); drawHistory();
}
function drawHistory() {
  const box = $('history'), list = hist; box.innerHTML = '';
  $('histClear').classList.toggle('hidden', !list.length);
  if (!list.length) { box.innerHTML = '<div class="empty">No requests yet.</div>'; return; }
  list.forEach(e => {
    const d = mk('div', 'hist'); d.title = e.m + ' ' + e.u; d.append(mk('b', '', e.m), e.u);
    d.onclick = () => {
      $('method').value = e.m; $('url').value = e.u; $('body').value = e.b || ''; $('bodyType').value = e.bt || 'json';
      data.headers = (e.h && e.h.length) ? JSON.parse(JSON.stringify(e.h)) : [{on:true,k:'',v:''}];
      renderKV('headers'); urlToParams(false); syncPath();
      (e.pv || []).forEach(p => { const r = data.path.find(x => x.k === p.k); if (r) r.v = p.v; });
      renderPath(); send();
    };
    box.appendChild(d);
  });
}

// ---- controls ----
$('go').onclick = send;
$('save').onclick = saveCurrent;
$('histClear').onclick = () => { if (confirm('Clear all request history?')) { hist = []; persist(); drawHistory(); } };
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('url').addEventListener('input', () => { urlToParams(); syncPath(); });
$('body').addEventListener('input', counts);
$('fmtJson').onclick = () => {
  try { $('body').value = JSON.stringify(JSON.parse($('body').value), null, 2); }
  catch (e) { alert('Body is not valid JSON: ' + e.message); }
};
document.querySelectorAll('.ltab').forEach(t => t.onclick = () => showTab(t.dataset.tab));
function toggle(a, b, key, val) { state[key] = val; $(a).classList.add('active'); $(b).classList.remove('active'); render(); }
$('tabBody').onclick    = () => toggle('tabBody','tabHeaders','tab','body');
$('tabHeaders').onclick = () => toggle('tabHeaders','tabBody','tab','headers');
$('fmtPretty').onclick  = () => toggle('fmtPretty','fmtRaw','pretty',true);
$('fmtRaw').onclick     = () => toggle('fmtRaw','fmtPretty','pretty',false);
$('copy').onclick = () => navigator.clipboard.writeText(state.image ? state.finalUrl : $('output').textContent);

(() => { // draggable divider
  const div = $('divider'), left = $('left'); let drag = false;
  div.onmousedown = () => { drag = true; document.body.style.userSelect = 'none'; };
  window.onmouseup = () => { drag = false; document.body.style.userSelect = ''; };
  window.onmousemove = e => { if (drag) left.style.width = Math.max(260, Math.min(e.clientX, innerWidth - 250)) + 'px'; };
})();

// Quit button (shown only when the server allows shutdown)
fetch('/api/shutdown').then(r => { if (r.ok) $('quit').classList.remove('hidden'); }).catch(() => {});
$('quit').onclick = async () => {
  if (!confirm('Stop Endpoint Checker? You will have to start it again to use it.')) return;
  try { await fetch('/api/shutdown', { method:'POST', headers:{ 'X-EC-Shutdown':'1' } }); } catch {}
  document.body.innerHTML = '<div style="padding:40px;font:16px system-ui">Endpoint Checker has stopped. You can close this tab.</div>';
};

(() => { // resizable lists (height is remembered)
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('ec_heights') || '{}'); } catch {}
  const store = () => localStorage.setItem('ec_heights', JSON.stringify(saved));
  document.querySelectorAll('.grip').forEach(g => {
    const key = g.dataset.for, list = $(key);
    const apply = h => { list.style.maxHeight = 'none'; list.style.height = h + 'px'; };
    if (saved[key]) apply(saved[key]);
    g.onpointerdown = e => {
      e.preventDefault(); g.setPointerCapture(e.pointerId);
      const y0 = e.clientY, h0 = list.offsetHeight;
      g.onpointermove = ev => apply(Math.max(60, h0 + ev.clientY - y0));
      g.onpointerup = g.onpointercancel = () => { g.onpointermove = g.onpointerup = g.onpointercancel = null; saved[key] = list.offsetHeight; store(); };
    };
    g.ondblclick = () => { list.style.height = list.style.maxHeight = ''; delete saved[key]; store(); };
  });
})();

renderKV('params'); renderKV('headers'); renderPath(); counts();
loadData().then(() => { drawApis(); drawHistory(); });
</script>
